name: Python tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Verify Tkinter layout and saved-address workflow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          xvfb-run -a python -m unittest -v test_stay_gui_smoke test_pdf_merge_gui
